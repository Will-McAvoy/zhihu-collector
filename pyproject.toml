[project]
name = "zhihu-collector"
version = "0.1.7"
description = "知乎内容搜集器：个人公开内容的离线归档工具"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Will-McAvoy"}]
dependencies = [
    "playwright==1.63.0",
    "PySide6>=6.6",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "markdownify>=0.13",
    "python-docx>=1.1",
    "Markdown>=3.5",
    "pypdf>=6,<8",
]

[project.scripts]
zhihu-collector = "zhihu_collector.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[project.urls]
Homepage = "https://github.com/Will-McAvoy/zhihu-collector"
Repository = "https://github.com/Will-McAvoy/zhihu-collector"
Issues = "https://github.com/Will-McAvoy/zhihu-collector/issues"
